; ============================================================================
;  cumulusutils-help.ini  —  help texts for the CumulusUtils.ini Editor
; ============================================================================
;
;  This file must sit in the same folder as CumulusUtilsIniEditor.exe.
;  It is re-read every time you open a file, so you can edit it and just
;  reopen cumulusutils.ini — no restart needed.
;
;  Structure mirrors cumulusutils.ini itself:
;
;      [Section]
;      Key=Your explanation of this setting.
;
;  Lookup order for a key:
;    1. Section/Key   — the most specific text
;    2. A line "="    — section-wide text (use * instead of a key name)
;    3. bare Key      — applies to that key in every section
;
;  A key without a text simply gets a disabled (i) button.
;  Lines starting with ; or # are ignored. Leave the file out entirely and
;  the program still runs — the (i) buttons are then all disabled.
;
; ============================================================================


[General]
*Values in this section apply to the whole CumulusUtils run.
LoggingOn=Write a log file for each run. Useful when you need to report a problem — the log is what the author will ask for.
NormalMessageToConsole=Also print the normal progress messages to the console window, not just warnings and errors.
TraceInfoLevel=How much detail goes into the log. "error" is quietest, "trace" is the most verbose.
ChartContainerHeight=Height in pixels of the box that holds each chart on the website. 650 suits most screens.
ChartBackgroundImage=Optional background image behind the charts. Leave empty for the theme default. Can be a path or a URL.
IgnoreDataErrors=Keep going when a data line in the log files is malformed. Recommended on, so one bad line cannot stop a whole run.
GeneratejQueryInclude=Let CumulusUtils write the jQuery <script> include into the generated pages. Turn off if your template already loads jQuery.
DoLibraryIncludes=Let CumulusUtils write the <script> includes for the charting library. Turn off if your template does this itself.
Language=Language of the generated website. The commented line below the setting shows the alternative that ships with CumulusUtils.
UseSQL=Use a MySQL database as the source for the reports instead of the monthly log files.
UseScrollableTables=Make long tables scrollable instead of letting them run off the page.
RecordsBeganDate=The date your weather records start, as dd/MM/yy. Used to decide how far back the reports reach.
MaxErrors=After this many errors CumulusUtils stops. Protects against a broken configuration producing thousands of log lines.
CMXport=The port on which CumulusMX serves its data. Must match the port in CumulusMX itself.
UseSpecificHighchartsVersion=Pin a particular Highcharts version. Leave empty to use the one that ships with CumulusUtils.
DoModular=Generate the site as separate module pages rather than one long page. Required for the menu structure.
ModulePath=Folder where the modules are written, relative to your web root.
NeedSolarEnergyDailyValuesInCSV=Also put the daily solar energy values in the CSV output. Only needed if your own templates use them.
CheckDateOrder=Catch out-of-order timestamps in the log files. Worth leaving on.
ConnectNulls=Draw chart lines straight through gaps instead of breaking the line. Useful when the station has intermittent outages.
ParamCleanUp=Remove obsolete parameters from this file when CumulusUtils runs. Leave off while you are still editing by hand.
LastUploadTime=Read-only. CumulusUtils stamps this itself after a successful upload; editing it here has no effect.


[pwsFWI]
*Settings for the Canadian Fire Weather Index module.
Analyse=How many days of history go into the analysis. 90 days gives a sensible FWI.
WarningLevel=The pwsFWI value at which the module starts showing a warning colour.
ResultFormat=Which FWI presentation the module produces. "beteljuice" is the compact dial; "standard" is the plain table.
FireImage=Show the flame graphic alongside the FWI value.
PredictionBackground=Background colour of the prediction box. Any CSS colour name or #rrggbb.
CurrentIndexFormat=How the current index is described. "Standard" uses the official band names; "Betel-Kocher" the finer subdivision.
CurrentPwsFWI=The HTML fragment the module writes for the current value. Normally maintained by CumulusUtils.
CurrentIndexDay=Whether the module reports today's index or yesterday's.


[Top10]
BackgroundColorHeader=Background colour of the header row of the Top 10 tables.
BackgroundColorTable=Background colour of the data rows.
TextColorAccentTable=Colour used to highlight a record that was set in the period being shown.
TextColorHeader=Text colour in the header row.
NumberOfColumns=How many columns the Top 10 table is spread over. Four keeps it readable on a phone.


[NOAA]
FTPDirectory=Folder on the website where the NOAA reports are placed.
ColorNOAAText=Text colour of the NOAA report.
ColorNOAABackground=Background colour of the NOAA report.
StartInCurrentMonth=Open the NOAA report on the current month instead of January of the current year.


[Graphs]
*Each true/false below switches one chart type on or off. Turning off the ones you do not publish keeps the run short.
UseHighchartsBoostModule=Speed up charts that draw a very large number of points. Can blur very dense lines; turn off if you see artefacts.
UseNormalTempReference=Whether temperature charts show the normal range, your own station history, both, or neither.
UseNormalRainReference=Same choice for the rainfall charts.
MaxNrOfSeriesVisibileInGraph=How many series a chart shows before the legend starts grouping them.
PeriodMovingAverage=Length in days of the moving average drawn over the temperature charts. 180 is about half a year.
WindRoseNrOfWindforceClasses=How many wind-force bands the wind rose is divided into. Six is the common choice.
WindRoseMaxWindSpeed=The wind speed at the outer edge of the wind rose, in your configured unit.
WindRoseInversed=Mirror the wind rose so it reads in the other rotational direction.
WindrunClassWidth=Width of each band in the wind-run chart.
HeatmapNumberOfYearsPerPage=How many years a single heat map page covers.
GrowingDegreeDaysReferenceTemp=Base temperature for growing degree days. Crops vary; 5 °C is a common general value.
WinterToSpringTemperatureLimit=The temperature that marks the switch from winter to spring colouring on the seasonal charts.
SpringToSummerTemperatureLimit=The temperature that marks the switch from spring to summer colouring.
GraphColors=Override the default series colours. Format is a bracketed list of quoted colours, as shown in the commented example line.
WindRoseColors=Override the colours of the wind rose bands, same list format as above.


[FTP site]
DoUploadFTP=Upload the generated files to your website.
UploadDir=Path on the FTP server to upload into. Leave empty for the account''s root.
FtpLog=How much the FTP client writes to the log. "off" is the quiet setting.
MaxConcurrentUploads=How many files are uploaded at once. Leave empty for the default; lower it if your host dislikes parallel connections.
delayMilliSeconds=Pause between uploads, in milliseconds. Raise it if your host throttles or blocks you.


[Maps]
Website=Your public website address. Used for links and for the station map.
Participant=Whether you take part in the CumulusUtils station map.
DoneToday=Read-only. CumulusUtils records the last successful map update here.


[Website]
*Colours and layout of the generated site. Colours accept CSS colour names or #rrggbb.
StatisticsType=Which visitor statistics the site uses, if any. None, Google or Matomo.
GoogleStatsId=Your Google Analytics measurement ID, of the form G-XXXXXXXXXX.
MatomoTrackerUrl=Full URL of your Matomo instance, used only when StatisticsType is Matomo.
MatomoSiteId=The site ID inside that Matomo instance.
PermitGoogleOptout=Let visitors opt out of Google Analytics.
CumulusRealTimeLocation=Where your realtime.txt lives. Leave empty if you do not publish realtime data.
ShowInsideMeasurements=Include your indoor readings in the dashboard.
CumulusRealTimeInterval=How often the realtime panel refreshes, in seconds.
PwsfwiButtonInHeader=Put a shortcut to the fire weather module in the site header.
ShowUV=Show the UV readings on the dashboard.
ShowSolar=Show the solar readings on the dashboard.
HeaderLeftText=The HTML shown at the left of the site header. Can contain links and images, as in the examples above this setting.
HeaderRightText=The HTML shown at the right of the site header, typically a badge.
SiteTitleAddition=Extra text appended to the site title.
UseCMXMoonImage=Use CumulusMX''s own moon image rather than the one from the browser.
MoonImageLocation=Where that moon image is found, if you host your own.
FooterCenterText=HTML shown in the middle of the footer.
SteelseriesFramedesign=The bezel style of the steel-series gauges.
SteelseriesBackgroundColor=Background colour of the gauge faces.
SteelseriesPointerColour=Colour of the gauge needles.
SteelseriesPointerType=Shape of the temperature needle.
SteelseriesDirAvgPointertype=Shape of the wind-direction average needle.
SteelseriesDirAvgPointerColour=Colour of the wind-direction average needle.
SteelseriesLcdColour=Colour of the digital readout inside the gauges.
SteelseriesForegroundType=Style of the gauge foreground shading.
SteelseriesKnobType=Type of knob drawn on the gauge.
SteelseriesKnobStyle=Colour of that knob.
SteelseriesRainUseSectionColours=Colour the rainfall gauge by section rather than by gradient.
SteelseriesRainUseGradientColours=Colour the rainfall gauge by gradient rather than by section.
SteelseriesTempThresholdValue=Temperature at which the steel-series temperature readout changes colour.
SteelseriesLedVisible=Draw the small indicator lamp on the gauges.
Panel-1=Which widget occupies each dashboard slot. Any of the Panel-1…Panel-24 keys takes the same set of widget names; leaving a slot empty simply leaves it blank.


[SysInfo]
ReportWidth=Width in pixels of the system information report.
SystemInfoLinesToSkip=Output lines of the CumulusMX system info to drop, as comma-separated line numbers.
Tx=Number of transmitter channels your station reports.
ExtraStationInfo=Free text describing your hardware, shown in the system information report.
SystemInfoMenu=Put a link to the system information in the site menu.


[Thrifty]
*How far back each report group reaches, in days. Keep these short on a slow host.
Top10RecordsPeriod=Days of history used for the Top 10 records.
RainGraphsPeriod=Days shown in the rainfall graphs.
TempGraphsPeriod=Days shown in the temperature graphs.
WindGraphsPeriod=Days shown in the wind graphs.
MiscGraphsPeriod=Days shown in the remaining graphs.
MapsPeriod=Days shown on the map pages.
SolarGraphsPeriod=Days shown in the solar graphs.


[StationMap]
StationMapMenu=Put a link to the station map in the site menu.
Zoomlevel=Initial zoom of the embedded map. Higher zooms in further.
CompassRosePosition=Which corner of the map holds the compass rose.
CompassRoseType=Which compass rose design to draw.
WindArrowType=Which wind arrow design to draw.
ArrowLatitude=Latitude of the wind arrow, in decimal degrees.
ArrowLongitude=Longitude of the wind arrow, in decimal degrees.


[Compiler]
SmaPeriod=Length in days of the simple moving average used by the compiler.
DoneToday=Read-only. CumulusUtils stamps the last successful compile here.


[MeteoCam]
MeteoCamMenu=Put a link to the camera page in the site menu.
MeteoCamDir=Folder holding the camera images, relative to your web root.
TimelapseExtension=File extension of the timelapse video.
MeteoCamName=File name of the still image the camera publishes.
CamType=Which camera model is in use. Choose None to switch the camera page off, Generic for anything not listed.
FontSize=Font size in pixels of the text overlaid on the camera image.
FontWeight=Weight of that overlaid text.
BottomOffset=Distance in pixels from the bottom of the image to the overlay text.
BlockLeftOrRight=Which side of the image the overlay text sits on.
BorderOffset=Distance in pixels from the image edge to the overlay text.
TextAlign=Alignment of the overlay text within its block.
TextColor=Colour of the overlay text.
WantToSeeLines=Which overlay lines are drawn, given as letters. WTPHR is wind, temperature, pressure, humidity, rain.
AdditionalViewerCSS=Extra CSS applied to the camera viewer page.


[AirLink]
*Settings for the PurpleAir / AirLink air quality module.
CountrySelected=Which country''s air quality scale the module uses when colouring the readings.
WantToSeeNow=Show the current air quality reading.
WantToSeeNowCast=Show the now-cast estimate.
WantToSee1hr=Show the one-hour trend.
WantToSee3hr=Show the three-hour trend.
WantToSee24hr=Show the twenty-four hour trend.
WantToSeeWind=Include the wind readings on the air quality page.
CleanupAirlinkLogs=Remove old air quality log files automatically.
StandAloneModule=Run the air quality module on its own rather than as part of the site.
ReferenceLineThickness=Thickness of the reference line on the air quality charts, in pixels.


[ExtraSensors]
*Extra sensors appear as a comma-separated list of channel numbers, e.g. 1,2,3,4.
*Leave a list empty when you have no sensor of that kind — that switches it off.
ExtraSensors=Master switch for all extra sensors.
ParticipatesSensorCommunity=Share your readings with the Sensor.Community network.
CleanupExtraSensorslog=Remove old extra-sensor log files automatically.
UserModificationExtraSensorCharts=Keep your own edits to the extra-sensor charts when CumulusUtils regenerates them.
ExternalExtraSensors=Channel numbers of sensors that come from an external source rather than from CumulusMX.
ExtraTemp=Channel numbers of extra temperature sensors, e.g. 1,2,3,4.
ExtraHum=Channel numbers of extra humidity sensors.
ExtraDP=Channel numbers of extra dew-point sensors.
SoilTemp=Channel numbers of soil temperature sensors.
SoilMoisture=Channel numbers of soil moisture sensors.
AirQuality=Channel numbers of the Ecowitt WH41 air quality sensors.
SoilTemperature=Channel numbers of soil temperature sensors that report as a separate type.
UserTemp=Channel numbers of your own custom temperature sensors.
LeafWetness=Channel numbers of leaf wetness sensors.
CO2=Channel numbers of CO2 sensors.
LightningSensor=Whether you have a lightning sensor. Unlike the lists above this is a plain true/false switch.
LaserDist=Channel numbers of the laser distance sensors.
LaserDepth=Channel numbers of the laser depth sensors.


[CustomLogs]
CustomLogs=Master switch for the custom log files. Requires a paid CumulusMX licence.
UserModificationCustomLogsCharts=Keep your own edits to the custom-log charts when CumulusUtils regenerates them.
ExcludedCustomLogs=Names of custom logs to leave out of the site, comma-separated.
DoneToday=Read-only. CumulusUtils stamps the last successful custom-log run here.


[Diary]
Diary=Switch the weather diary module on or off.
ColorDiaryText=Text colour of the diary page.
ColorDiaryBackground=Background colour of the diary page.
ColorDiaryChartSnowDepth=Colour of the snow depth line in the diary chart.
ColorDiaryChartSnow24h=Colour of the snowfall in the last 24 hours in the diary chart.


[Forecasts]
ForecastSystem=Which forecast source the site uses. CUtils is the built-in forecast; the others need their own configuration.
